# Production Profile Configuration
# CORS lives HERE ONLY - downstream services never emit CORS headers.
gateway:
  rate-limit:
    enabled: true
    max-requests: 100
    window-seconds: 60

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://localhost:8081}

jwt:
  public-key: ${JWT_PUBLIC_KEY:#{null}}
  # Portfolio visitors can browse the catalogue without logging in.
  # GET only; all write/admin endpoints still require a real JWT.
  public-read-routes: /api/products,/api/products/all,/api/products/(?!me$)[a-zA-Z0-9-]+,/api/products/[^/]+/images,/api/categories,/api/categories/[a-zA-Z0-9-]+,/api/categories/slug/[^/]+,/api/promotions/active
  public-routes:
    - /api/auth/login
    - /api/auth/register
    - /api/auth/refresh
    - /api/banners/public
    - /api/ws

logging:
  level:
    root: WARN
    com.ecommerce.api_gateway: INFO
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF
    org.springframework.cloud.gateway: WARN

server:
  shutdown: immediate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
