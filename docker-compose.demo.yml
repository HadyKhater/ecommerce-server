name: ecommerce-demo

# Reduced demo for a 1 GB VM: discovery + gateway + auth + product + order.
# Set POSTGRES_* to an external free Postgres (Neon/Supabase) in .env, or
# uncomment the postgres service below to keep it local.
x-env: &env
  SPRING_PROFILES_ACTIVE: prod
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?set in .env}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set in .env}
  EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
  JAVA_TOOL_OPTIONS: "-Xms64m -Xmx160m -XX:+UseSerialGC -XX:MaxMetaspaceSize=64m"

services:
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   networks: [backend]
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
  #     POSTGRES_DB: ecommerce
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #     - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  eureka-server:
    restart: unless-stopped
    networks: [backend]
    build: { context: ., dockerfile: Dockerfile, target: eureka-server }
    environment: { <<: *env, SERVER_PORT: 8761 }
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  api-gateway:
    restart: unless-stopped
    networks: [backend, edge]
    build: { context: ., dockerfile: Dockerfile, target: api-gateway }
    environment:
      <<: *env
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_URL: http://auth-service:8081
    depends_on:
      eureka-server: { condition: service_healthy }

  auth-service:
    restart: unless-stopped
    networks: [backend]
    build: { context: ., dockerfile: Dockerfile, target: auth-service }
    environment:
      <<: *env
      POSTGRES_DB: auth_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set in .env}
    depends_on:
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  product-service:
    restart: unless-stopped
    networks: [backend]
    build: { context: ., dockerfile: Dockerfile, target: product-service }
    environment: { <<: *env, POSTGRES_DB: product_db }
    depends_on:
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  order-service:
    restart: unless-stopped
    networks: [backend]
    build: { context: ., dockerfile: Dockerfile, target: order-service }
    environment:
      <<: *env
      POSTGRES_DB: order_db
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on:
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks: [edge]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway: { condition: service_started }

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
