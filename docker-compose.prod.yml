name: ecommerce

# Production stack. ONLY caddy publishes ports; everything else is internal.
# Copy .env.example -> .env and fill it before starting.

x-env-common: &env-common
  SPRING_PROFILES_ACTIVE: prod
  TZ: UTC
  JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms128m -Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m}"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: 5432
  POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  GATEWAY_INTERNAL_SECRET: ${GATEWAY_INTERNAL_SECRET:?set GATEWAY_INTERNAL_SECRET in .env}
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY in .env}
  EUREKA_SERVER_URL: http://eureka-server:8761/eureka/

x-service-base: &service-base
  restart: unless-stopped
  networks:
    - backend

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 6
  start_period: 120s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 1) Discovery server starts first.
  eureka-server:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      target: eureka-server
    environment:
      <<: *env-common
      SERVER_PORT: 8761
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    healthcheck:
      test: ["CMD-SHELL", "busybox wget -q -O /dev/null http://127.0.0.1:8761/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  # 2) Gateway starts next (needs Eureka). It does NOT publish a host port.
  api-gateway:
    <<: *service-base
    build:
      context: .
      dockerfile: Dockerfile
      target: api-gateway
    networks:
      - backend
      - edge
    environment:
      <<: *env-common
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      AUTH_SERVICE_URL: http://auth-service:8081
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m"
    healthcheck:
      <<: *healthcheck
      start_period: 180s
    depends_on:
      eureka-server:
        condition: service_healthy

  # 3) All business services.
  auth-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: auth-service }
    environment:
      <<: *env-common
      POSTGRES_DB: auth_db
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?set JWT_PRIVATE_KEY in .env}
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      api-gateway:
        condition: service_started

  product-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: product-service }
    environment:
      <<: *env-common
      POSTGRES_DB: product_db
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  cart-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: cart-service }
    environment:
      <<: *env-common
      POSTGRES_DB: cart_db
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  inventory-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: inventory-service }
    environment:
      <<: *env-common
      POSTGRES_DB: inventory_db
      JAVA_TOOL_OPTIONS: "-Xms96m -Xmx256m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m"
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  order-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: order-service }
    environment:
      <<: *env-common
      POSTGRES_DB: order_db
      PRODUCT_SERVICE_URL: http://product-service:8082
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  payment-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: payment-service }
    environment:
      <<: *env-common
      POSTGRES_DB: payment_db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL:-http://localhost:4200/payment/success?sessionId={CHECKOUT_SESSION_ID}}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL:-http://localhost:4200/payment/cancel}
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  notification-service:
    <<: *service-base
    build: { context: ., dockerfile: Dockerfile, target: notification-service }
    environment:
      <<: *env-common
      POSTGRES_DB: notification_db
    healthcheck:
      <<: *healthcheck
    depends_on:
      postgres: { condition: service_healthy }
      eureka-server: { condition: service_healthy }
      api-gateway: { condition: service_started }

  # The reverse proxy is the ONLY public entry point (ports 80/443).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    networks:
      - edge
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in .env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api-gateway:
        condition: service_started

networks:
  backend:
    driver: bridge
  edge:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
