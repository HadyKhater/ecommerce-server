spring:
  application:
    name: payment-service

  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: 911911
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: false
    validate-on-migrate: false

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    should-enforce-registration-at-init: true
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

logging:
  level:
    root: INFO
    com.netflix.eureka: OFF
    com.netflix.discovery: OFF

gateway:
  internal-secret: ${GATEWAY_INTERNAL_SECRET:super-secret-gateway-key}

stripe:
  api-key: ${STRIPE_SECRET_KEY:sk_test_51TY2lsFIMsEYqNvl7pBB2foYDEwvBqLDPySRhcF01SPrkaL46V9jirlTZ4G8xvufsPomXHK4WCRnNZrc7W6YmDL900gPiuLGiP}
  public-key: ${STRIPE_PUBLIC_KEY:pk_test_51TY2lsFIMsEYqNvlpomUPKVci5SSDXBdPjyxbl8JPXnqQRvBkLztBvxVrFaBHpyQTdRyncwW4limwsPj1QGXf4ww001OcwPlTd}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_572e9ad1691050e9166ab242598beebf230503addc643ff7d4fbbd5b049b6c01}
  success-url: ${STRIPE_SUCCESS_URL:http://localhost:4200/payment/success?sessionId={CHECKOUT_SESSION_ID}}
  cancel-url: ${STRIPE_CANCEL_URL:http://localhost:4200/payment/cancel}

resilience4j:
  circuitbreaker:
    instances:
      orderService:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowType: COUNT_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      paymentProviderRetry:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

